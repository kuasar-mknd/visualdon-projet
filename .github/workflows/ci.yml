name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
            if node -e "const pkg=require('./package.json'); if(!pkg.scripts?.build) process.exit(1)"; then
              pnpm run build
            else
              echo "Skipping build: script not found"
            fi

      - name: Lint
        run: |
            if node -e "const pkg=require('./package.json'); if(!pkg.scripts?.lint) process.exit(1)"; then
              pnpm run lint
            else
              echo "Skipping lint: script not found"
            fi

      - name: Test
        run: |
            if node -e "const pkg=require('./package.json'); if(!pkg.scripts?.test) process.exit(1)"; then
              pnpm run test
            else
              echo "Skipping test: script not found"
            fi
