name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scripts
        id: check-scripts
        run: |
          node -e '
            const pkg = require("./package.json");
            const scripts = pkg.scripts || {};
            if (scripts.lint) console.log("has_lint=true");
            if (scripts.build) console.log("has_build=true");
            if (scripts.test) console.log("has_test=true");
          ' >> $GITHUB_OUTPUT

      - name: Lint
        if: steps.check-scripts.outputs.has_lint == 'true'
        run: pnpm run lint

      - name: Build
        if: steps.check-scripts.outputs.has_build == 'true'
        run: pnpm run build

      - name: Test
        if: steps.check-scripts.outputs.has_test == 'true'
        run: pnpm run test
